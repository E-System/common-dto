import java.nio.file.Files
import java.nio.file.NoSuchFileException
import java.nio.file.Paths
import java.time.LocalDateTime

buildscript {
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:4.0.0.2929"
    }
}
plugins {
    id "com.github.ben-manes.versions" version "0.44.0"
}
wrapper {
    gradleVersion = '8.0.2'
}

def resolve(String name) {
    return (System.getenv(name) ?: project.properties[name]).toString()
}

println(System.getenv())
println(properties)

apply from: "build-${resolve('profile')}.gradle"
apply plugin: 'idea'
apply plugin: 'java'
apply plugin: 'java-library'
apply plugin: 'groovy'
apply plugin: 'maven-publish'
apply plugin: 'jacoco'

sourceCompatibility = JavaVersion.VERSION_1_8
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
if (JavaVersion.current() != JavaVersion.VERSION_1_8) {
    compileJava {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
        options.release = 8
    }
    compileTestJava {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
        options.release = 8
    }
    compileTestGroovy {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
        options.release = 8
    }
    compileGroovy {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
        options.release = 8
    }
}

group = ext.mainGroup
version = ext.mainVersion + (ext.snapshot ? '-SNAPSHOT' : '')

repositories {
    mavenCentral()
    mavenLocal()
}

idea {
    project {
        jdkName = '1.8'
        languageLevel = JavaVersion.VERSION_1_8
    }
    module {
        downloadJavadoc = false
        downloadSources = false
        inheritOutputDirs = true
        excludeDirs += file('gradle')
        excludeDirs += file('out')
    }
}

def propName = rootProject.name
def fullPath = '/com/es/lib/dto'
if (!fullPath.startsWith('/src/main/resources')) {
    fullPath = '/src/main/resources' + fullPath
}
def versionString = "${project.version}"
def filePath = "${project.projectDir}${fullPath}/"
new File(filePath).mkdirs()
try {
    Files.delete(Paths.get(filePath, 'build.properties'))
} catch (NoSuchFileException ignore) {
}
println("Create file for property: ${filePath}")
project.ant.propertyfile(file: "${filePath}build.properties") {
    ant.entry(key: 'name', value: propName)
    ant.entry(key: 'version', value: versionString)
    ant.entry(key: 'date', value: "${LocalDateTime.now().toString()}")
}

jar {
    manifest {
        attributes(
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'E-SYSTEM'
        )
    }
}
javadoc {
    failOnError = false
    options.encoding = 'utf-8'
}
java {
    withSourcesJar()
    withJavadocJar()
}
publishing {
    repositories {
        maven {
            url = uri("${resolve("repos_url")}${((snapshot as Boolean) ? "snapshots" : "releases")}")
            credentials {
                username = resolve("repos_user")
                password = resolve("repos_password")
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
ext {
    jacksonVersion = '2.14.2'
}
dependencies {
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
    implementation "io.swagger.core.v3:swagger-annotations:2.2.9"

    compileOnly 'org.projectlombok:lombok:1.18.22'
    annotationProcessor 'org.projectlombok:lombok:1.18.22'

    testImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'
    testImplementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

def sonarAvailable = resolve('sonar_url') != null && resolve('sonar_user') != null && resolve('sonar_password') != null
if (sonarAvailable) {
    apply plugin: 'org.sonarqube'
    sonar {
        properties {
            property "sonar.host.url", resolve('sonar_url')
            property "sonar.login", resolve('sonar_user')
            property "sonar.password", resolve('sonar_password')
        }
    }
}